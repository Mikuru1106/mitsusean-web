name: Daily fan snapshot

on:
  push:
    branches: [main]
  schedule:
    - cron: '0 1 * * *' # 北京时间每天 09:00
  workflow_dispatch:

permissions:
  contents: write

jobs:
  snapshot:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install dependencies
        run: npm ci
      - name: Collect snapshot
        continue-on-error: true
        run: npm run snapshot
        env:
          BILI_COOKIE: ${{ secrets.BILI_COOKIE }}
      - name: Collect videos
        continue-on-error: true
        run: npm run videos-snapshot
        env:
          BILI_COOKIE: ${{ secrets.BILI_COOKIE }}
      - name: Archive homepage audio
        run: npm run audio-snapshot
        env:
          BILI_COOKIE: ${{ secrets.BILI_COOKIE }}
      - name: Commit snapshot
        run: |
          git config user.name "snapshot-bot"
          git config user.email "bot@users.noreply.github.com"
          git add -A public/data public/audio
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m "chore: daily fan snapshot"
          git pull --rebase origin main
          git push
