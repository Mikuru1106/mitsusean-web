name: Hourly fan snapshot

# 每小时刷新一次粉丝快照,并触发 Pages 重新构建,
# 让线上显示的数据保持在 1 小时内(Cloudflare Worker 那条实时链路已被 B 站封 IP,不可用)。

on:
  schedule:
    - cron: '0 * * * *'
  workflow_dispatch:

permissions:
  contents: write
  actions: write

concurrency:
  group: hourly-snapshot
  cancel-in-progress: true

jobs:
  snapshot:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Collect snapshot
        env:
          BILI_COOKIE: ${{ secrets.BILI_COOKIE }}
        run: npm run snapshot

      - name: Commit snapshot
        id: commit
        run: |
          git config user.name "snapshot-bot"
          git config user.email "bot@users.noreply.github.com"
          git add public/data/fans-history.json
          if git diff --cached --quiet; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          git commit -m "chore: hourly fan snapshot"
          git pull --rebase origin main
          git push
          echo "changed=true" >> "$GITHUB_OUTPUT"

      # GITHUB_TOKEN 触发的 push 不会再次触发 deploy.yml,所以这里显式派发一次
      - name: Trigger Pages rebuild
        if: steps.commit.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run deploy.yml --repo "$GITHUB_REPOSITORY"
