<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>V4 · 白卡青柠 — B站数据观测舱</title>
<link rel="stylesheet" href="/fonts/zcool.css" />
<style>
/* ============================================================
   DESIGN BRIEF · V4「白卡青柠」
   骨架取自 02 粉彩 Bento，表面语言取自参考图：
   - 底色近白偏紫，卡片纯白，靠明度差 + 极淡阴影浮起，无描边
   - 圆角 28，内边距宽，标签小灰、数字特大贴底、单位缩成小字跟在右边
   - 青柠只出现三次：LIVE 胶囊 / 曲线末端点 / TOP1 角标
   - 玫瑰留给涨跌与标题强调，其余全是黑与灰
   ============================================================ */
:root{
  --bg:#f4f2fa;
  --bg-2:#f8f6fc;
  --card:#fdfcff;
  --card-hi:#ffffff;
  --ink:#17151f;
  --ink-2:#3b3548;
  --muted:#8f8b9e;
  --faint:#b6b2c4;
  --line:rgba(38,28,58,.075);
  --lime:#d9f27c;
  --lime-ink:#2f3d0c;
  --rose:#b76e79;
  --up:#c2606f;
  --lilac:#8b74d8;
  --r:28px;
  --shadow:0 2px 4px rgba(38,28,58,.02), 0 18px 40px -32px rgba(38,28,58,.45);
  --shadow-hi:0 4px 8px rgba(38,28,58,.03), 0 26px 50px -30px rgba(38,28,58,.5);
  --font-round:'ZCOOL QingKe HuangYou','Yuanti SC',YouYuan,'Microsoft YaHei',sans-serif;
  --font-ui:'General Sans',system-ui,-apple-system,'PingFang SC','Microsoft YaHei',sans-serif;
  --font-mono:ui-monospace,SFMono-Regular,Consolas,monospace;
  --ease:cubic-bezier(.16,1,.3,1);
}
*{margin:0;padding:0;box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{
  background:var(--bg);
  color:var(--ink);
  font-family:var(--font-ui);
  font-size:15px;
  line-height:1.6;
  -webkit-font-smoothing:antialiased;
  min-height:100vh;
}
::selection{background:rgba(217,242,124,.65);color:var(--ink)}
img{display:block;max-width:100%}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer}

/* 一点点粉光，和站内奶油底衔接 */
body::before{
  content:"";position:fixed;inset:0;z-index:0;pointer-events:none;
  background:
    radial-gradient(60% 44% at 12% 0%, rgba(255,214,228,.5), transparent 70%),
    radial-gradient(50% 40% at 92% 8%, rgba(206,199,246,.42), transparent 72%);
}

.wrap{
  position:relative;z-index:1;
  max-width:1140px;margin-inline:auto;
  padding:clamp(40px,5vw,72px) clamp(20px,4vw,32px) clamp(40px,5vw,72px);
}

/* ---------- 顶栏 ---------- */
.top{
  display:flex;align-items:flex-end;justify-content:space-between;
  gap:24px;flex-wrap:wrap;margin-bottom:clamp(22px,3vw,32px);
}
.eyebrow{
  font-family:var(--font-mono);font-size:9.5px;letter-spacing:.28em;
  text-transform:uppercase;color:var(--muted);
}
h2{
  font-family:var(--font-round);font-weight:400;
  font-size:clamp(2.1rem,3.6vw,3rem);line-height:1.05;letter-spacing:.01em;
  margin-top:10px;
}
h2 b{
  font-weight:400;color:#9d4f5c;
  background:#fbe2e8;
  padding:.1em .18em .16em;margin-left:.1em;border-radius:13px;
  box-decoration-break:clone;
  box-shadow:0 6px 16px -12px rgba(183,110,121,.9);
}
.lede{
  margin-top:10px;font-size:13px;line-height:1.75;color:var(--muted);max-width:40ch;
}
.lede b{color:var(--ink-2);font-weight:600}

.top-right{display:flex;align-items:center;gap:10px;flex-wrap:wrap}

.pill{
  display:inline-flex;align-items:center;gap:7px;
  height:38px;padding:0 16px;border-radius:999px;
  font-size:11.5px;font-weight:600;letter-spacing:.02em;
  background:var(--card);color:var(--ink-2);
  box-shadow:var(--shadow);
}
.pill.lime{background:var(--lime);color:var(--lime-ink);box-shadow:0 10px 24px -16px rgba(140,170,40,.9)}
.pill .dot{width:6px;height:6px;border-radius:50%;background:var(--lime-ink);animation:pulse 2.4s var(--ease) infinite}
@keyframes pulse{0%{box-shadow:0 0 0 0 rgba(47,61,12,.45)}70%{box-shadow:0 0 0 6px rgba(47,61,12,0)}100%{box-shadow:0 0 0 0 rgba(47,61,12,0)}}

.seg{display:flex;gap:6px}
.seg button{
  height:38px;padding:0 16px;border-radius:999px;
  font-size:11.5px;font-weight:600;color:var(--muted);
  background:var(--card);box-shadow:var(--shadow);
  transition:background .25s var(--ease),color .25s var(--ease),transform .25s var(--ease);
}
.seg button:hover{transform:translateY(-1px);color:var(--ink-2)}
.seg button[aria-pressed="true"]{background:var(--ink);color:#fff}

/* ---------- 卡片通用 ---------- */
.card{
  position:relative;
  background:var(--card);
  border-radius:var(--r);
  box-shadow:var(--shadow);
  transition:transform .4s var(--ease),box-shadow .4s var(--ease),background .4s var(--ease);
}
.card:hover{transform:translateY(-3px);box-shadow:var(--shadow-hi);background:var(--card-hi)}

/* ---------- KPI ---------- */
.kpis{display:grid;grid-template-columns:repeat(4,1fr);gap:16px}
.kpi{
  display:flex;flex-direction:column;
  min-height:158px;padding:22px 24px 20px;
}
.kpi .lbl{
  display:flex;align-items:baseline;gap:7px;
  font-size:12.5px;font-weight:600;color:var(--ink-2);
}
.kpi .lbl span{
  font-family:var(--font-mono);font-size:9px;letter-spacing:.2em;
  text-transform:uppercase;color:var(--faint);
}
.kpi .big{
  margin-top:auto;display:flex;align-items:baseline;gap:6px;
  font-size:clamp(1.9rem,3vw,2.6rem);line-height:1;font-weight:800;
  letter-spacing:-.045em;font-variant-numeric:tabular-nums;
}
.kpi .big .unit{
  font-size:.36em;font-weight:600;letter-spacing:0;color:var(--faint);
}
.kpi .delta{
  margin-top:9px;font-size:11.5px;font-weight:600;color:var(--up);
  font-variant-numeric:tabular-nums;
}
.kpi .delta span{font-weight:500;color:var(--muted)}
.kpi .delta.flat{color:var(--muted);font-weight:500}

/* ---------- 主体 ---------- */
.main{display:grid;grid-template-columns:1.75fr 1fr;gap:16px;margin-top:16px}
.pad{padding:22px 24px 20px}

.card-head{display:flex;align-items:baseline;justify-content:space-between;gap:12px}
.card-head h3{font-size:13px;font-weight:700;letter-spacing:.01em;color:var(--ink)}
.card-head .hint{
  font-family:var(--font-mono);font-size:9.5px;letter-spacing:.14em;
  text-transform:uppercase;color:var(--faint);
}

/* ---------- 图表 ---------- */
.chart{position:relative;margin-top:14px}
.chart svg{display:block;width:100%;height:auto;overflow:visible;cursor:crosshair}
.tip{
  position:absolute;z-index:4;pointer-events:none;
  transform:translate(-50%,-100%);
  background:#fff;border-radius:14px;padding:9px 13px;
  box-shadow:0 10px 30px -12px rgba(38,28,58,.4);
  white-space:nowrap;font-size:11px;line-height:1.45;
  opacity:0;transition:opacity .16s ease;
}
.tip.on{opacity:1}
.tip .d{color:var(--muted);font-size:10px}
.tip b{display:block;font-size:15px;font-weight:800;letter-spacing:-.03em;font-variant-numeric:tabular-nums}
.tip i{font-style:normal;color:var(--up);font-weight:600}

.foot{
  display:flex;flex-wrap:wrap;gap:6px 22px;margin-top:16px;
  font-size:11px;color:var(--muted);font-variant-numeric:tabular-nums;
}
.foot b{color:var(--ink);font-weight:700}
.foot .up{color:var(--up)}

/* ---------- 热力 ---------- */
.heat{display:grid;grid-template-columns:repeat(13,1fr);gap:4px;margin-top:16px}
.heat i{
  aspect-ratio:1;border-radius:4px;background:rgba(139,116,216,.08);
  transition:transform .18s var(--ease),box-shadow .18s ease;
}
.heat i:hover{transform:scale(1.3);box-shadow:0 0 0 1.5px var(--ink);position:relative;z-index:2}
.legend{
  display:flex;align-items:center;gap:5px;margin-top:12px;
  font-size:9.5px;color:var(--faint);letter-spacing:.1em;
}
.legend i{width:10px;height:10px;border-radius:3px}
.legend .sp{flex:1}
.note{
  display:flex;gap:9px;margin-top:16px;padding-top:14px;
  border-top:1px solid var(--line);
  font-size:11.5px;line-height:1.7;color:var(--muted);
}
.note i{flex:none;width:6px;height:6px;margin-top:7px;border-radius:50%;background:var(--rose)}
.note b{color:var(--ink-2);font-weight:600}

/* ---------- TOP ---------- */
.section-head{
  display:flex;align-items:baseline;justify-content:space-between;gap:12px;
  margin:clamp(26px,3.4vw,36px) 0 14px;padding:0 4px;
}
.section-head h3{font-size:14px;font-weight:700}
.section-head .hint{font-family:var(--font-mono);font-size:9.5px;letter-spacing:.16em;text-transform:uppercase;color:var(--faint)}

.top-grid{display:grid;grid-template-columns:repeat(5,1fr);gap:16px}
.clip{
  display:flex;flex-direction:column;
  padding:18px 18px 16px;min-height:172px;
  text-decoration:none;color:inherit;
}
.clip .rank{
  font-family:var(--font-mono);font-size:9.5px;letter-spacing:.16em;color:var(--faint);
}
.clip .badge{
  position:absolute;top:14px;right:14px;
  height:22px;padding:0 10px;border-radius:999px;
  display:grid;place-items:center;
  background:var(--lime);color:var(--lime-ink);
  font-size:9px;font-weight:800;letter-spacing:.14em;
}
.clip .t{
  margin-top:10px;font-size:12.5px;font-weight:600;line-height:1.5;color:var(--ink-2);
  display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;
  transition:color .25s;
}
.clip:hover .t{color:var(--rose)}
.clip .p{
  margin-top:auto;padding-top:12px;
  display:flex;align-items:baseline;gap:5px;
  font-size:1.32rem;font-weight:800;letter-spacing:-.04em;font-variant-numeric:tabular-nums;
}
.clip .p .u{font-size:.4em;font-weight:600;letter-spacing:0;color:var(--faint)}
.bar{display:block;margin-top:11px;height:3px;border-radius:999px;background:rgba(139,116,216,.1);overflow:hidden}
.bar i{display:block;height:100%;border-radius:999px;background:linear-gradient(90deg,#d3c8f4,var(--lilac));transform-origin:left;animation:grow 1.1s var(--ease) both}
@keyframes grow{from{transform:scaleX(0)}to{transform:scaleX(1)}}

/* ---------- 入场 ---------- */
.rv{opacity:0;transform:translateY(16px);animation:rv .85s var(--ease) forwards}
@keyframes rv{to{opacity:1;transform:none}}

/* ---------- 响应式 ---------- */
@media (max-width:980px){
  .kpis{grid-template-columns:repeat(2,1fr)}
  .main{grid-template-columns:1fr}
  .top-grid{grid-template-columns:repeat(2,1fr)}
}
@media (max-width:600px){
  :root{--r:22px}
  .top{align-items:flex-start}
  .top-right{width:100%}
  .kpi{min-height:136px;padding:18px}
  .kpi .big{font-size:1.85rem}
  .top-grid{grid-template-columns:1fr}
  .clip{min-height:0}
  .pad{padding:18px}
}
@media (prefers-reduced-motion:reduce){
  *,*::before,*::after{animation:none!important;transition:none!important}
  .rv{opacity:1;transform:none}
}
</style>
</head>
<body>
<main class="wrap">

  <header class="top rv">
    <div>
      <p class="eyebrow">Source Observatory · No.071</p>
      <h2>B站数据<b>观测舱</b></h2>
      <p class="lede">第 <b>79</b> 天。10月18日那一波之后曲线没再落回去，最近一周每天还在涨 <b>244</b> 个。</p>
    </div>
    <div class="top-right">
      <span class="pill lime"><i class="dot"></i>LIVE · 每小时同步</span>
      <div class="seg" id="seg">
        <button type="button" data-days="30">30 日</button>
        <button type="button" data-days="90" aria-pressed="true">全部</button>
      </div>
    </div>
  </header>

  <!-- KPI -->
  <section class="kpis rv" id="kpis"></section>

  <!-- 曲线 + 热力 -->
  <section class="main rv">
    <article class="card pad">
      <div class="card-head">
        <h3>粉丝增长</h3>
        <span class="hint">悬停看单日</span>
      </div>
      <div class="chart" id="chartBox">
        <svg id="chart" viewBox="0 0 760 230" role="img" aria-label="粉丝增长折线图"></svg>
        <div class="tip" id="tip"></div>
      </div>
      <div class="foot" id="foot"></div>
    </article>

    <article class="card pad">
      <div class="card-head">
        <h3>涨粉热力</h3>
        <span class="hint" id="heatCount">已记录 70 天</span>
      </div>
      <div class="heat" id="heat" role="img" aria-label="每日净涨粉热力图"></div>
      <div class="legend">
        <span>少</span>
        <i style="background:rgba(139,116,216,.08)"></i>
        <i style="background:rgba(139,116,216,.24)"></i>
        <i style="background:rgba(139,116,216,.42)"></i>
        <i style="background:rgba(139,116,216,.64)"></i>
        <i style="background:rgba(139,116,216,.9)"></i>
        <span>多</span>
      </div>
      <p class="note"><i></i><span>10 月 18 日之后日均 <b>+700</b>，是 9 月的两倍多。</span></p>
    </article>
  </section>

  <!-- TOP 5 -->
  <div class="section-head rv">
    <h3>播放最高的视频</h3>
    <span class="hint">TOP 5 / 播放</span>
  </div>
  <section class="top-grid rv" id="tops"></section>

</main>

<script>
/* ---------- 数据（取自 public/data/fans-history.json） ---------- */
const RAW = "09-01:175295,09-02:175879,09-05:177659,09-06:178123,09-07:178269,09-08:178597,09-09:179036,09-10:179412,09-11:180314,09-12:181933,09-13:183055,09-14:183792,09-15:184224,09-16:184490,09-17:184652,09-18:184823,09-19:185078,09-20:185277,09-21:185447,09-22:185604,09-23:185736,09-24:185870,09-25:186121,09-26:186371,09-27:186567,10-04:188089,10-05:188147,10-06:188299,10-07:188438,10-08:188524,10-09:188619,10-10:189454,10-11:191251,10-12:192876,10-13:193631,10-14:194599,10-15:195683,10-16:196747,10-17:198676,10-18:200765,10-19:201807,10-20:202292,10-21:203202,10-22:204058,10-23:204667,10-24:205590,10-25:206541,10-26:207052,10-27:207499,10-28:207926,10-29:208499,10-30:208994,10-31:210247,11-01:211220,11-02:211897,11-03:212570,11-04:213273,11-05:213544,11-06:214023,11-07:214510,11-08:214960,11-09:215259,11-10:215537,11-11:216083,11-12:216627,11-13:217349,11-14:218149,11-15:218479,11-16:218644,11-17:218995,11-18:219239";
const DATA = RAW.split(",").map(s => { const [d, f] = s.split(":"); return { d, f: +f }; });

const KPI = [
  { label: "粉丝", sub: "FANS", value: 219239, unit: "人", delta: 244, extra: " · 7 日 +3,156" },
  { label: "播放", sub: "VIEWS", value: 7316079, unit: "", delta: null, note: "11/01 采集" },
  { label: "获赞", sub: "LIKES", value: 2241230, unit: "", delta: null, note: "11/01 采集" },
  { label: "稿件", sub: "WORKS", value: 94, unit: "条", delta: null, note: "近期未更新" },
];

const TOPS = [
  { t: "絶対領域なんて…", p: 1230650 },
  { t: "Nyanyanyanyanyanya", p: 1095976 },
  { t: "好き…？", p: 431949 },
  { t: "【配音】讨厌你…", p: 293123 },
  { t: "去了海边^ω^", p: 190577 },
];

const fmt = n => n.toLocaleString("zh-CN");
const pad2 = n => String(n).padStart(2, "0");

/* ---------- KPI ---------- */
document.getElementById("kpis").innerHTML = KPI.map(k => {
  const delta = k.delta == null
    ? `<p class="delta flat">${k.note}</p>`
    : `<p class="delta">+${fmt(k.delta)}<span> / 日${k.extra ?? ""}</span></p>`;
  return `<article class="card kpi">
    <p class="lbl">${k.label}<span>${k.sub}</span></p>
    <p class="big"><span data-count="${k.value}">${fmt(k.value)}</span>${k.unit ? `<span class="unit">${k.unit}</span>` : ""}</p>
    ${delta}
  </article>`;
}).join("");

document.querySelectorAll("[data-count]").forEach(el => {
  const target = +el.dataset.count;
  const t0 = performance.now();
  const dur = 900;
  const step = t => {
    const p = Math.min(1, (t - t0) / dur);
    el.textContent = fmt(Math.round(target * (1 - Math.pow(1 - p, 3))));
    if (p < 1) requestAnimationFrame(step);
  };
  requestAnimationFrame(step);
});

/* ---------- 折线 ---------- */
const W = 760, H = 230, PL = 44, PR = 10, PT = 18, PB = 28;
const NS = "http://www.w3.org/2000/svg";
const svg = document.getElementById("chart");
const tip = document.getElementById("tip");
const box = document.getElementById("chartBox");
let days = 90;

const el = (n, a) => { const e = document.createElementNS(NS, n); for (const k in a) e.setAttribute(k, a[k]); return e; };

function smooth(p) {
  let d = `M ${p[0].x} ${p[0].y}`;
  for (let i = 0; i < p.length - 1; i++) {
    const p0 = p[Math.max(0, i - 1)], p1 = p[i], p2 = p[i + 1], p3 = p[Math.min(p.length - 1, i + 2)];
    d += ` C ${p1.x + (p2.x - p0.x) / 6} ${p1.y + (p2.y - p0.y) / 6} ${p2.x - (p3.x - p1.x) / 6} ${p2.y - (p3.y - p1.y) / 6} ${p2.x} ${p2.y}`;
  }
  return d;
}

let pts = [];
function draw() {
  const data = DATA.slice(-days);
  const vals = data.map(d => d.f);
  const min = Math.min(...vals), max = Math.max(...vals), span = max - min || 1;
  const iw = W - PL - PR, ih = H - PT - PB;
  pts = data.map((d, i) => ({
    x: +(PL + (i / Math.max(1, data.length - 1)) * iw).toFixed(2),
    y: +(PT + (1 - (d.f - min) / span) * ih).toFixed(2),
    ...d,
  }));
  svg.innerHTML = "";

  const defs = el("defs");
  const g = el("linearGradient", { id: "ga", x1: 0, y1: 0, x2: 0, y2: 1 });
  g.append(el("stop", { offset: "0%", "stop-color": "#b7a6ee", "stop-opacity": ".38" }));
  g.append(el("stop", { offset: "100%", "stop-color": "#b7a6ee", "stop-opacity": "0" }));
  defs.append(g); svg.append(defs);

  for (let k = 0; k <= 3; k++) {
    const y = PT + (k / 3) * ih;
    const v = Math.round(max - (k / 3) * span);
    svg.append(el("line", { x1: PL, y1: y, x2: W - PR, y2: y, stroke: "rgba(38,28,58,.07)", "stroke-dasharray": k === 3 ? "0" : "2 6" }));
    const t = el("text", { x: PL - 10, y: y + 3.5, "text-anchor": "end", fill: "#b6b2c4", "font-size": "9.5", "font-family": "ui-monospace,Consolas,monospace" });
    t.textContent = (v / 10000).toFixed(1) + "万";
    svg.append(t);
  }

  const line = smooth(pts);
  svg.append(el("path", { d: `${line} L ${pts[pts.length - 1].x} ${H - PB} L ${pts[0].x} ${H - PB} Z`, fill: "url(#ga)" }));
  const path = el("path", { d: line, fill: "none", stroke: "#241f2e", "stroke-width": "2", "stroke-linecap": "round", "stroke-linejoin": "round" });
  svg.append(path);
  const len = path.getTotalLength();
  path.style.strokeDasharray = len;
  path.style.strokeDashoffset = len;
  path.animate([{ strokeDashoffset: len }, { strokeDashoffset: 0 }], { duration: 1400, easing: "cubic-bezier(.16,1,.3,1)", fill: "forwards" });

  // 末端点：青柠
  const last = pts[pts.length - 1];
  svg.append(el("circle", { cx: last.x, cy: last.y, r: 9, fill: "rgba(217,242,124,.55)" }));
  svg.append(el("circle", { cx: last.x, cy: last.y, r: 4.2, fill: "#c8e85c", stroke: "#fdfcff", "stroke-width": "2" }));

  // x 轴日期
  [0, pts.length - 1].forEach((idx, n) => {
    const p = pts[idx];
    const t = el("text", { x: p.x, y: H - 8, "text-anchor": n === 0 ? "start" : "end", fill: "#b6b2c4", "font-size": "9.5", "font-family": "ui-monospace,Consolas,monospace" });
    t.textContent = p.d;
    svg.append(t);
  });

  // 悬停
  const cross = el("line", { y1: PT - 6, y2: H - PB, stroke: "rgba(38,28,58,.22)", "stroke-dasharray": "2 4", opacity: "0" });
  const dot = el("circle", { r: 4, fill: "#241f2e", stroke: "#fdfcff", "stroke-width": "2", opacity: "0" });
  svg.append(cross, dot);

  const show = e => {
    const r = svg.getBoundingClientRect();
    const x = ((e.clientX - r.left) / r.width) * W;
    let best = 0, bd = 1e9;
    pts.forEach((p, i) => { const dd = Math.abs(p.x - x); if (dd < bd) { bd = dd; best = i; } });
    const p = pts[best], prev = pts[best - 1];
    cross.setAttribute("x1", p.x); cross.setAttribute("x2", p.x); cross.setAttribute("opacity", "1");
    dot.setAttribute("cx", p.x); dot.setAttribute("cy", p.y); dot.setAttribute("opacity", "1");
    tip.classList.add("on");
    tip.style.left = Math.min(90, Math.max(10, (p.x / W) * 100)) + "%";
    tip.style.top = (p.y / H) * 100 + "%";
    tip.style.marginTop = "-14px";
    tip.innerHTML = `<span class="d">${p.d}</span><b>${fmt(p.f)}</b>${prev ? `<i>+${fmt(p.f - prev.f)}</i>` : ""}`;
  };
  const hide = () => { tip.classList.remove("on"); cross.setAttribute("opacity", "0"); dot.setAttribute("opacity", "0"); };
  svg.onpointermove = show;
  svg.onpointerleave = hide;

  // 脚注
  let mx = 0;
  pts.forEach((p, i) => { if (i) mx = Math.max(mx, p.f - pts[i - 1].f); });
  document.getElementById("foot").innerHTML = `
    <span>起点 <b>${fmt(pts[0].f)}</b></span>
    <span>最新 <b>${fmt(last.f)}</b></span>
    <span>区间增幅 <b class="up">+${fmt(last.f - pts[0].f)}</b></span>
    <span>最大单日 <b>+${fmt(mx)}</b></span>`;
}

/* ---------- 热力 ---------- */
(function heat() {
  const out = [];
  for (let i = 1; i < DATA.length; i++) out.push({ d: DATA[i].d, v: DATA[i].f - DATA[i - 1].f });
  const sorted = out.map(o => Math.max(0, o.v)).sort((a, b) => a - b);
  const q = p => sorted[Math.min(sorted.length - 1, Math.floor(p * (sorted.length - 1)))] ?? 0;
  const [t1, t2, t3, t4] = [q(.15), q(.4), q(.65), q(.85)];
  const lv = v => v >= t4 ? 4 : v >= t3 ? 3 : v >= t2 ? 2 : v >= t1 ? 1 : 0;
  const colors = ["rgba(139,116,216,.08)", "rgba(139,116,216,.24)", "rgba(139,116,216,.42)", "rgba(139,116,216,.64)", "rgba(139,116,216,.9)"];

  const pad = (13 - (out.length % 13)) % 13;
  const cells = [...Array(pad).fill(null), ...out];
  const box = document.getElementById("heat");
  box.style.gridTemplateRows = `repeat(${cells.length / 13}, 1fr)`;
  box.innerHTML = cells.map(c => c
    ? `<i style="background:${colors[lv(Math.max(0, c.v))]}" title="${c.d} · +${c.v}"></i>`
    : `<i style="background:rgba(38,28,58,.045)" title="尚未记录"></i>`).join("");
  document.getElementById("heatCount").textContent = `已记录 ${out.length} 天`;
})();

/* ---------- TOP ---------- */
(function tops() {
  const max = Math.max(...TOPS.map(t => t.p));
  document.getElementById("tops").innerHTML = TOPS.map((t, i) => `
    <a class="card clip" href="#" onclick="return false">
      ${i === 0 ? '<span class="badge">TOP 1</span>' : ""}
      <span class="rank">0${i + 1}</span>
      <p class="t" title="${t.t}">${t.t}</p>
      <p class="p">${fmt(t.p)}<span class="u">播放</span></p>
      <span class="bar"><i style="width:${(t.p / max * 100).toFixed(1)}%"></i></span>
    </a>`).join("");
})();

/* ---------- 区间切换 ---------- */
document.getElementById("seg").addEventListener("click", e => {
  const b = e.target.closest("button");
  if (!b) return;
  days = +b.dataset.days;
  document.querySelectorAll("#seg button").forEach(x => x.setAttribute("aria-pressed", x === b ? "true" : "false"));
  draw();
});

draw();
</script>
